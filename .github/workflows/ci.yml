# Every push and pull request: check the kit.
# A push to main that passes and carries a new VERSION: tag v<VERSION>, publish a GitHub release, and warm
# jsDelivr so the kit is served at https://cdn.jsdelivr.net/gh/<owner>/docs-kit@v<VERSION>/doc.js (one URL per
# release, never overwritten). 0.x on purpose: nothing depends on the kit publicly yet.
name: ci

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Kit is English-only
        run: python3 bin/verify.py --kit

      - name: Vendored libraries match their pinned sha256
        run: python3 bin/vendor-fetch.py

      - name: JavaScript parses
        run: for f in doc.js components/*.js; do node --check "$f"; done

      - name: The assistant reference (llms.txt, llms-full.txt) matches the code
        run: python3 bin/build-llms.py --check

      - name: Gallery and example pages render every component
        run: bash bin/gallery-check.sh

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag and publish the release in VERSION, once
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="v$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "$version is already released; bump VERSION to publish a new one." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$version" --target "$GITHUB_SHA" --title "$version" --generate-notes
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Warm jsDelivr and print the URLs
        if: steps.tag.outputs.released == 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          base="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${VERSION}"
          for f in doc.js doc.css llms.txt llms-full.txt AGENTS.md; do
            curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "$base/$f"
          done
          {
            echo "### Released ${VERSION}"
            echo '```html'
            echo "<script src=\"$base/doc.js\"></script>"
            echo '```'
            echo "Guide for assistants: $base/llms-full.txt"
          } >> "$GITHUB_STEP_SUMMARY"
