# Every push and pull request: check the kit.
# A push to main that passes and carries a new VERSION: tag v<VERSION>, publish a GitHub release, and warm
# jsDelivr so the kit is served at https://cdn.jsdelivr.net/gh/<owner>/docs-kit@v<VERSION>/doc.js (one URL per
# release, never overwritten). 0.x on purpose: nothing depends on the kit publicly yet.
name: ci

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Kit is English-only
        run: python3 bin/verify.py --kit

      - name: Vendored libraries match their pinned sha256
        run: python3 bin/vendor-fetch.py

      - name: JavaScript parses
        run: for f in doc.js components/*.js; do node --check "$f"; done

      - name: The assistant reference (llms.txt, llms-full.txt) matches the code
        run: python3 bin/build-llms.py --check

      - name: Gallery and example pages render every component
        run: bash bin/gallery-check.sh

      - name: The Claude Code marketplace and plugin are valid
        run: |
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code > /dev/null
          claude plugin validate . --strict
          claude plugin validate plugin --strict

      - name: docs-kit-check passes on the example pages
        run: for f in examples/*.html; do plugin/bin/docs-kit-check "$f"; done

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write        # npm provenance: the package links back to this workflow run
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag and publish the release in VERSION, once
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="v$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "$version is already released; bump VERSION to publish a new one." >> "$GITHUB_STEP_SUMMARY"
          else
            (cd plugin/skills && zip -qr "$RUNNER_TEMP/docs-kit-skill.zip" docs-kit)
            gh release create "$version" "$RUNNER_TEMP/docs-kit-skill.zip" --target "$GITHUB_SHA" --title "$version" --generate-notes
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm, once per version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(cat VERSION)"
          if npm view "@tannc26/docs-kit@$version" version > /dev/null 2>&1; then
            echo "@tannc26/docs-kit@$version is already on npm." >> "$GITHUB_STEP_SUMMARY"
          else
            npm publish --provenance --access public
            # A new version takes minutes to reach the registry's public document (200 s on 2026-09-24), and
            # jsDelivr caches any 404 it serves meanwhile, so the next step must not ask for files before then.
            for i in $(seq 1 45); do
              npm view "@tannc26/docs-kit@$version" version > /dev/null 2>&1 && break
              sleep 20
            done
            echo "Published @tannc26/docs-kit@$version to npm." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Warm jsDelivr and print the URLs
        if: steps.tag.outputs.released == 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          base="https://cdn.jsdelivr.net/npm/@tannc26/docs-kit@${VERSION#v}"
          # purge first: a file requested before the version existed would otherwise keep a cached 404
          for f in doc.js doc.css llms.txt llms-full.txt AGENTS.md; do
            curl -fsS -o /dev/null "https://purge.jsdelivr.net/npm/@tannc26/docs-kit@${VERSION#v}/$f" || true
            curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "$base/$f"
          done
          {
            echo "### Released ${VERSION}"
            echo '```html'
            echo "<script src=\"$base/doc.js\"></script>"
            echo '```'
            echo "Guide for assistants: $base/llms-full.txt"
          } >> "$GITHUB_STEP_SUMMARY"
